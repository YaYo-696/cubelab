name: CubeLab CI and Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CUBELAB_E2E_BROWSER: chromium
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:filter
      - run: npm test
      - run: npm run build
      - run: node tools/check-pwa.mjs dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  publish:
    if: github.ref == 'refs/heads/main' && vars.CUBELAB_PAGES_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: cubelab-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build preview with DEV flags
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          node --experimental-strip-types --input-type=module -e "import { devFlags } from './src/config/devFlags.ts'; if (!Object.values(devFlags).every(Boolean)) process.exit(1)"
          npm run build -- --base "${PAGES_BASE%/}/preview/"
          node tools/check-pwa.mjs dist
          mkdir -p site/preview
          cp -a dist/. site/preview/
          printf '%s\n' '<!doctype html><html lang="es"><meta charset="utf-8"><title>CubeLab</title><meta http-equiv="refresh" content="0;url=./preview/"><a href="./preview/">Vista previa de CubeLab</a></html>' > site/index.html
      - name: Check out the approved release
        if: vars.CUBELAB_RELEASE_REF != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ vars.CUBELAB_RELEASE_REF }}
          path: stable
      - name: Verify and build release
        if: vars.CUBELAB_RELEASE_REF != ''
        env:
          CUBELAB_E2E_BROWSER: chromium
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        working-directory: stable
        run: |
          npm ci
          npm run release:check
          npm run lint
          npm run test:filter
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm run build -- --base "${PAGES_BASE%/}/release/"
          node tools/check-pwa.mjs dist
          mkdir -p ../site/release
          cp -a dist/. ../site/release/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
